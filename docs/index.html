<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>EduVerify API — Docs</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5/swagger-ui.css" />
    <style>
      :root { color-scheme: light; }
      body { margin: 0; background: #fafafa; }
      .topbar { display: none !important; }
    </style>
  </head>
  <body>
    <div id="swagger-ui"></div>
    <script>
      // swagger-ui-standalone-preset.js's own DarkModeToggle component checks
      // matchMedia("(prefers-color-scheme: dark)") on mount and adds an html.dark-mode class
      // it manages itself — independent of (and not fixed by) this page's <meta
      // name="color-scheme">, which only affects browser-level heuristics, not this library's
      // own JS-driven theme. Shadowing matchMedia before that script loads makes its check see
      // "not dark" instead, so the page renders in the intended light theme unconditionally.
      (function () {
        const nativeMatchMedia = window.matchMedia.bind(window);
        window.matchMedia = function (query) {
          if (typeof query === "string" && /prefers-color-scheme:\s*dark/.test(query)) {
            return { matches: false, media: query, addListener() {}, removeListener() {}, addEventListener() {}, removeEventListener() {} };
          }
          return nativeMatchMedia(query);
        };
      })();
    </script>
    <script src="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5/swagger-ui-bundle.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5/swagger-ui-standalone-preset.js"></script>
    <script>
      window.ui = SwaggerUIBundle({
        url: "./openapi.yaml",
        dom_id: "#swagger-ui",
        deepLinking: true,
        presets: [SwaggerUIBundle.presets.apis, SwaggerUIStandalonePreset],
        plugins: [SwaggerUIBundle.plugins.DownloadUrl],
        layout: "StandaloneLayout",
        tryItOutEnabled: true,
      });
    </script>
  </body>
</html>

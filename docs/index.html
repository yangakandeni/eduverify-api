    <script>
      // swagger-ui-standalone-preset.js's own DarkModeToggle component checks
      // matchMedia("(prefers-color-scheme: dark)") on mount and adds an html.dark-mode class
      // it manages itself — independent of (and not fixed by) this page's <meta
      // name="color-scheme">, which only affects browser-level heuristics, not this library's
      // own JS-driven theme. Shadowing matchMedia before that script loads makes its check see
      // "not dark" instead, so the page renders in the intended light theme unconditionally.
      (function () {
        const nativeMatchMedia = window.matchMedia.bind(window);
        window.matchMedia = function (query) {
          if (typeof query === "string" && /prefers-color-scheme:\s*dark/.test(query)) {
            return { matches: false, media: query, addListener() { }, removeListener() { }, addEventListener() { }, removeEventListener() { } };
          }
          return nativeMatchMedia(query);
        };
      })();
    </script>

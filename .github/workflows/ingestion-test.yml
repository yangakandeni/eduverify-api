name: Ingestion Tests

on:
  pull_request:
    paths:
      - "ingestion/**"
      - "terraform/modules/dynamodb/**"
      - "terraform/modules/s3/**"
      - "terraform/modules/iam_ingestion/**"
      - "terraform/modules/lambda_ingestion_container/**"
      - "terraform/ingestion/**"
      - ".github/workflows/ingestion-test.yml"

jobs:
  pytest:
    name: Ingestion pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ingestion/requirements.txt

      - name: Install ingestion dependencies
        run: pip install -r requirements.txt
        working-directory: ingestion

      - name: Run pytest
        run: python -m pytest tests/ -v
        working-directory: ingestion

  docker-build:
    name: Ingestion container image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build ingestion Lambda image
        run: docker build -f ingestion/Dockerfile -t eduverify-api-ingestion:ci ingestion/

  terraform-validate:
    name: Ingestion terraform fmt & validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: Terraform fmt check
        run: terraform fmt -check -recursive terraform/ingestion terraform/modules/dynamodb terraform/modules/s3 terraform/modules/iam_ingestion terraform/modules/lambda_ingestion_container

      # No remote backend is configured here, so init without a backend just downloads
      # providers/modules — no AWS credentials needed to validate.
      - name: Terraform init (no backend)
        run: terraform init -backend=false
        working-directory: terraform/ingestion

      - name: Terraform validate
        run: terraform validate
        working-directory: terraform/ingestion
